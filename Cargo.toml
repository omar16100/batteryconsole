[package]
name = "batteryconsole"
version = "0.1.0"
edition = "2021"
description = "CLI tool to check Logitech MX device battery levels on macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/omar16100/batteryconsole"
keywords = ["logitech", "battery", "bluetooth", "cli", "macos"]
categories = ["command-line-utilities"]

[dependencies]
hidapi = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
